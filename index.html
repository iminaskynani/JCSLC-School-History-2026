</style></head><body><div class="stage"><main class="main"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="desc" id="description"></p><div class="buttons"><button id="details">View Detailed History by Year</button></div></main><nav class="nav"><button id="prev">← Previous</button><span class="counter" id="counter"></span><button id="next">Next →</button></nav></div><div class="overlay" id="overlay" aria-hidden="true"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogtitle"><button class="close" id="close">Close ✕</button><h2 id="dialogtitle"></h2><div id="detailbody"></div></div></div><script>
const phases=[{"title": "Phase 1: The Realization (2004)", "desc": "This phase marked the realization of a unique master plan which was designed to build a model Catholic and Christian community coupled with a quality education. The school with its service as the foremost objective caters a socialized education."}, {"title": "Phase 2: Building the Foundation (2005-2010)", "desc": "This phase marked the starting of the school operations from the Preparatory Level up to High School Department. This was witnessed by Mrs. Gloria S. Beltran as [overall] Principal, then followed by Dr. Henry A. Davalos. This was also managed by Fr. Marion C. Munda as School Director."}, {"title": "Phase 3: School Reap What They Sow (2010-2020)", "desc": "In this phase, the school have witnessed the fruits of its labor. The school was always placed at the top rank in the National Achievement Test, won competitions outside the school, and presented student research internationally. The school also received certifications and recognitions from the Fund for Assistance to Private Education (FAPE), Manila Archdiocesan and Parochial Schools Association (MAPSA), and the Philippine Accrediting Association of Schools, Colleges and Universities (PAASCU). The school also produced its first graduates from the different departments. To further continue the mission of the school, they implemented the Student Activities Program, the Computerized Grading System, the Understanding by Design Curriculum, the integration of Science Curriculum to High School Department, and the operation of the Senior High School Department."}, {"title": "Phase 4: Adjusting to the New Normal (2020-2022)", "desc": "As pandemic strikes globally, the school saw the opportunity to provide services while in the safety of their homes. Thus, the LEAP and HOPE programs were implemented. The school offered the fully online learning modality and adapted the use of Learning Management System. In addition, the school connected to the community in this time of uncertainty."}, {"title": "Phase 5: Persevering Through Challenges (2022-2025)", "desc": "Emerging from the challenges of the pandemic, the school demonstrated resilience and renewed commitment to its mission, highlighted by the granting of PAASCU Level II accreditation status to its Basic Education Program. The introduction of the Cardinalis Fidelis Ceremonial Walk, House System, and Catholic Youth Athletic Program further strengthened camaraderie, leadership, and holistic development, reflecting the school's enduring dedication to its founder's vision."}, {"title": "Phase 6: Now and the Future (2026-present)", "desc": "Entering a new chapter, the school strengthened its institutional leadership with the installation of a new Assistant School Director and Finance Officer. Its recognition as a pilot school for the Strengthened Senior High School Curriculum further affirmed its commitment to educational innovation. As it celebrates its 20th Founding Anniversary, the school continues to honor its legacy of faith, excellence, and service while embracing opportunities for future growth."}],years=[{"year": "2004", "detail": "marked the realization of a unique master plan which was designed to build a model Catholic and Christian community coupled with a quality education “The JCS Learning Center” offers. The school with its service as the foremost objective caters a socialized education."}, {"year": "2005-2006", "detail": "it started to operate nursery to preparatory levels."}, {"year": "2006-2007", "detail": "Mrs. Gloria Beltran was appointed as the principal. Mark the birth of the Grade School Department, a continuation of the early quality Catholic education formation that our Late Eminence Jaime Cardinal Sin has dreamt for the children of our less fortunate brothers and sisters."}, {"year": "2007-2008", "detail": "the second-year operation of the school in elementary level."}, {"year": "2008-2009", "detail": "the third-year implementation of the school in elementary level."}, {"year": "2009-2010", "detail": "the school fulfilled the completion of its Patriarch's Vision, the foundation of the High School Department equipped with modernized resources. The institution offered Science Curriculum where Rev. Fr. Marion Mark C. Munda as the School Director and the appointed principal was Dr. Henry A. Davalos. In this year, computerized Grading System from Grades 1-4- and First-year level was also implemented."}, {"year": "2010-2011", "detail": "the pioneer students took the National Achievement Test and ranked No. 4 out of 89 schools in the Division of City Schools Manila. The school was also certified by the Fund for Assistance to Private Education (FAPE). Additionally, this year is also, the start of the revision of the Curriculum using Understanding by Design (UbD). The school was granted to offer Third- and Fourth-Year level and at the same time the school completed the laboratory equipment for sciences."}, {"year": "2011-2012", "detail": "the pioneer students at the High School Department proved their competence and excellence as they obtained high result in National Career Assessment Examination. In this year, the school has its first visitation of MAPSA and the Students Activity Program was implemented. The school was the champion in cheer dance (GS) and pep squad (HS) competition in MAPSA subsystem. The first batch of graduating students from elementary level took the National Achievement Test. This is also the year when we have the first batch of graduates in the elementary level."}, {"year": "2012-2013", "detail": "we have the first batch of graduates in the High School Level."}, {"year": "2013-2014", "detail": "the school ranked 2nd out of 89 schools in the City Schools Division Manila (4th year) and ranked 3rd among the 90 plus schools in the city Schools Division Manila (Grade 6) in the National Achievement Test."}, {"year": "2014-2015", "detail": "the school passed the preliminary visit for PAASCU accreditation."}, {"year": "2015-2016", "detail": "the school continuously achieved recognition when the Grade 6 pupils ranked no.4 in the National Achievement test. This year is also the implementation of the senior high school program under the K-12 curriculum."}, {"year": "2016-2017", "detail": "the school continuously achieved recognition when the Grade 6 pupils ranked no.4 in the National Achievement test. This year is also the implementation of the senior high school program under the K-12 curriculum."}, {"year": "2017-2018", "detail": "marked the first Senior High School graduation"}, {"year": "2018-2019", "detail": "the second batch of Senior High School students participated and won in the Research Congress."}, {"year": "2019-2020", "detail": "the school joined in the Metrobank- MTAP DepEd Math Challenge and qualified in the Division Level (Grade 9). This year is also the start of renovations of some of the facilities in the school such as TLE room and canteen. This year also marked the construction of the school gymnasium on the fourth floor."}, {"year": "2020-2021", "detail": "The administration of fully on-line classes for the new normal. The first virtual graduation and moving up ceremony of the Basic Education Department. Webinar and orientation for the school faculty on learning management system, teaching strategies and inter-active application to enhance classroom instruction."}, {"year": "2022-2023", "detail": "The Basic Education Program has been granted level Il status by the PAASCU."}, {"year": "2023-2024", "detail": "The JCSLC launched its Ceremonial Walk - an initiation rite welcoming the transferees and freshmen to the Cardinal community. The name CARDINALIS FIDELIS was also introduced signifying the identity of the members of the school community, faithful cardinal. Additionally, the House System was launched. Symbolizing the school's Core Values - House of Justice and Peace House of Excellence and Selfless Service, House of Love and Compassion, and House of Communion with God and his creation. It aims to foster camaraderie and strengthen familial bonds among students and personnel. Implementing the CYAP (Catholic Athletic Program Sports Program) Cluster 3 where student-athlete scholarships were given to the 1st batch of varsity players for basketball and volleyball."}, {"year": "2024-2025", "detail": "The Ceremonial Walk, known as Cardinalis Fidelis, was held for the second year, continuing as a meaningful welcome tradition for new students. The House System entered its second year of implementation, with ongoing activities that promoted core values, teamwork, and student leadership. The Catholic Youth Athletic Program was sustained to support student-athletes in inter-school sports events. The varsity scholarship program welcomed its second batch of scholars in basketball and volleyball, promoting excellence in both academics and athletics."}, {"year": "2025-2026", "detail": "The school marked a new chapter in its institutional leadership with the formal installation of Rev. Fr. Edward Jayson S. San Diego as Assistant School Director, strengthening its commitment to educational excellence and faith-driven service. The school reinforced its commitment to responsible financial stewardship and institutional sustainability with the formal installation of Rev. Fr. Paul Enrique Gungon IV as Finance Officer. The school achieved a significant milestone when it was officially recognized by the Schools Division Office of Manila as one of the pilot schools for the implementation of the Strengthened Senior High School Curriculum. The school reached a historic milestone as it celebrated its 20th Founding Anniversary, commemorating two decades of unwavering dedication to Catholic education, academic excellence, and service to the community."}];let index=0;const $=id=>document.getElementById(id);
function show(){if(index===0){$('eyebrow').textContent='2004 – Present';$('title').textContent='Our School History';$('description').textContent='Jaime Cardinal Sin Learning Center, Inc. — a mission school rooted in faith, education, and service. Explore six phases of our institutional journey.'}else{let p=phases[index-1];$('eyebrow').textContent='Phase '+index+' of '+phases.length;$('title').textContent=p.title.replace(/^Phase \d+:\s*/, '');$('description').textContent=p.desc} $('counter').textContent=(index+1)+' / '+(phases.length+1);$('prev').disabled=index===0;$('next').disabled=index===phases.length}
const groups=[null,['2004'],['2005-2006','2006-2007','2007-2008','2008-2009','2009-2010'],['2010-2011','2011-2012','2012-2013','2013-2014','2014-2015','2015-2016','2016-2017','2017-2018','2018-2019','2019-2020'],['2020-2021'],['2022-2023','2023-2024','2024-2025'],['2025-2026']];
function openDetails(){let selected=index===0?years:years.filter(y=>groups[index].includes(y.year));$('dialogtitle').textContent=index===0?'Complete Year-by-Year History':phases[index-1].title;let root=$('detailbody');root.replaceChildren();for(let y of selected){let sec=document.createElement('section');sec.className='entry';let h=document.createElement('h3');h.textContent=y.year;let p=document.createElement('p');p.textContent=y.detail;sec.append(h,p);root.append(sec)}if(index===4){let n=document.createElement('p');n.className='note';n.textContent='The source document does not include a separate annual entry for 2021–2022.';root.append(n)}$('overlay').classList.add('open');$('overlay').setAttribute('aria-hidden','false');$('close').focus()}
function closeDetails(){$('overlay').classList.remove('open');$('overlay').setAttribute('aria-hidden','true');$('details').focus()}
$('prev').onclick=()=>{index=Math.max(0,index-1);show()};$('next').onclick=()=>{index=Math.min(phases.length,index+1);show()};$('details').onclick=openDetails;$('close').onclick=closeDetails;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeDetails()};document.addEventListener('keydown',e=>{if($('overlay').classList.contains('open')){if(e.key==='Escape')closeDetails();return}if(e.key==='ArrowRight'){index=Math.min(phases.length,index+1);show()}if(e.key==='ArrowLeft'){index=Math.max(0,index-1);show()}});show();
</script></body></html>
